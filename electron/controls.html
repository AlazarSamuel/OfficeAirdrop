<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GrabCut - Floating Controls</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg-backdrop: rgba(6, 8, 16, 0.65);
      --record-red: #ef4444;
      --record-glow: rgba(239, 68, 68, 0.45);
      --record-border: rgba(239, 68, 68, 0.85);
      --card-glass: rgba(14, 15, 30, 0.88);
      --glass-border: rgba(255, 255, 255, 0.12);
    }
    body, html {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background: transparent;
      user-select: none;
      -webkit-app-region: drag;
    }
    
    /* ================= DOCKED FLOATING CONTROL PILL ================= */
    .floating-control-dock {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--card-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 16px rgba(0, 0, 0, 0.4);
      z-index: 30;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }

    .floating-control-dock:hover {
      border-color: rgba(255, 255, 255, 0.18);
    }

    /* Live Monospace Timer Pill */
    .dock-timer-group {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-right: 8px;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      -webkit-app-region: no-drag;
    }

    .timer-readout {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.88rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    /* Pause / Resume Button */
    .btn-dock-pause {
      -webkit-app-region: no-drag;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      height: 32px;
      padding: 0 12px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-dock-pause:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }

    .btn-dock-pause.paused {
      background: rgba(16, 185, 129, 0.18);
      border-color: rgba(16, 185, 129, 0.4);
      color: #34d399;
    }

    /* Stop Button */
    .btn-dock-stop {
      -webkit-app-region: no-drag;
      background: var(--record-red);
      border: none;
      color: #ffffff;
      height: 32px;
      padding: 0 14px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 4px 14px var(--record-glow);
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-dock-stop:hover {
      background: #dc2626;
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.6);
    }

    .btn-dock-stop:active {
      transform: translateY(0);
    }

    .stop-square {
      width: 9px;
      height: 9px;
      background: #ffffff;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <div class="floating-control-dock">
    <div class="dock-timer-group">
      <i data-lucide="video" style="width: 14px; height: 14px; color: #ef4444;"></i>
      <span class="timer-readout" id="timer">00:00</span>
    </div>

    <button class="btn-dock-pause" id="pauseBtn">
      <i data-lucide="pause" style="width: 13px; height: 13px;"></i>
      <span id="pauseText">Pause</span>
    </button>

    <button class="btn-dock-stop" id="stopBtn">
      <span class="stop-square"></span>
      <span>Stop</span>
    </button>
  </div>

  <script>
    lucide.createIcons();
    const { ipcRenderer } = require('electron');

    let isPaused = false;
    const pauseBtn = document.getElementById('pauseBtn');
    
    pauseBtn.addEventListener('click', () => {
      isPaused = !isPaused;
      pauseBtn.classList.toggle('paused', isPaused);
      if (isPaused) {
        pauseBtn.innerHTML = '<i data-lucide="play" style="width: 13px; height: 13px;"></i><span>Resume</span>';
      } else {
        pauseBtn.innerHTML = '<i data-lucide="pause" style="width: 13px; height: 13px;"></i><span>Pause</span>';
      }
      lucide.createIcons();
      ipcRenderer.send('floating-pause');
    });

    document.getElementById('stopBtn').addEventListener('click', () => {
      ipcRenderer.send('floating-stop');
    });

    ipcRenderer.on('recording-timer-update', (event, timeStr) => {
      document.getElementById('timer').textContent = timeStr;
    });
  </script>
</body>
</html>
