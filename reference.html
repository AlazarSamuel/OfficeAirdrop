<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manual Installation Modal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg: #070810;
      --card-bg: rgba(22, 23, 44, 0.88);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Modal Backdrop Glow */
    .ambient-glow {
      position: absolute;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.14) 0%, rgba(168, 85, 247, 0.05) 50%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Modal Container */
    .modal-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 24px 50px -10px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.04);
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow: hidden;
    }

    /* Top Accent Gradient Line */
    .modal-accent-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899);
    }

    /* Modal Header */
    .modal-header {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .icon-badge {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #a5b4fc;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .header-text h2 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.01em;
    }

    .header-text p {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 3px;
      line-height: 1.4;
    }

    /* Step List Box */
    .steps-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      padding: 14px 16px;
    }

    .step-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .step-number {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.4);
      color: #c4b5fd;
      font-size: 0.72rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .step-content {
      font-size: 0.83rem;
      color: #cbd5e1;
      line-height: 1.45;
      flex: 1;
    }

    .step-content strong {
      color: #ffffff;
    }

    /* URL Copy Field Component */
    .url-copy-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 6px 8px 6px 12px;
      margin-top: 6px;
      margin-bottom: 2px;
    }

    .url-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: #a5b4fc;
      user-select: all;
    }

    .copy-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: #cbd5e1;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }

    .copy-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    /* Modal Footer Buttons */
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      padding-top: 4px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.09);
      color: #fff;
    }

    .btn-primary {
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <!-- Manual Installation Modal -->
  <div class="modal-card">
    <div class="modal-accent-bar"></div>

    <!-- Header -->
    <div class="modal-header">
      <div class="icon-badge">
        <i data-lucide="globe" style="width: 22px; height: 22px;"></i>
      </div>
      <div class="header-text">
        <h2>Manual Installation</h2>
        <p>To enable direct transfers, install the companion extension using Chrome's Developer Mode.</p>
      </div>
    </div>

    <!-- Steps -->
    <div class="steps-container">
      <!-- Step 1 -->
      <div class="step-row">
        <div class="step-number">1</div>
        <div class="step-content">
          <span>Open your browser's extensions page:</span>
          <div class="url-copy-box">
            <span class="url-text" id="ext-url">chrome://extensions</span>
            <button class="copy-btn" onclick="copyUrl()">
              <i data-lucide="copy" style="width: 12px; height: 12px;"></i>
              <span id="copy-text">Copy</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Step 2 -->
      <div class="step-row">
        <div class="step-number">2</div>
        <div class="step-content">
          Toggle <strong>Developer mode</strong> ON in the top-right corner.
        </div>
      </div>

      <!-- Step 3 -->
      <div class="step-row">
        <div class="step-number">3</div>
        <div class="step-content">
          Click <strong>Load unpacked</strong> and choose the extension folder below.
        </div>
      </div>
    </div>

    <!-- Footer Actions -->
    <div class="modal-footer">
      <button class="btn btn-secondary">Close</button>
      <button class="btn btn-primary">
        <i data-lucide="folder-open" style="width: 16px; height: 16px;"></i>
        Open Extension Folder
      </button>
    </div>
  </div>

  <script>
    lucide.createIcons();

    function copyUrl() {
      const url = document.getElementById('ext-url').innerText;
      navigator.clipboard.writeText(url).then(() => {
        const copyText = document.getElementById('copy-text');
        copyText.innerText = 'Copied!';
        setTimeout(() => { copyText.innerText = 'Copy'; }, 2000);
      });
    }
  </script>
</body>
</html>
