<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GrabCut - YouTube Exact 16:9 Adaptive Fit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-dark: #07080f;
      --sidebar-bg: #0f1022;
      --content-bg: #0c0d1c;
      --card-bg: rgba(22, 23, 44, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      --live-red: #ef4444;
      --live-bg: rgba(239, 68, 68, 0.08);
      --live-border: rgba(239, 68, 68, 0.22);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 10% 20%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
        radial-gradient(at 90% 80%, rgba(139, 92, 246, 0.08) 0px, transparent 50%);
      color: var(--text-main);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Window Container */
    .app-window {
      position: absolute;
      width: 1040px;
      height: 700px;
      min-width: 520px;
      min-height: 440px;
      background: var(--content-bg);
      border-radius: 12px;
      border: 1px solid var(--card-border);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 10;
    }

    .app-window.maximized {
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      border-radius: 0;
      border: none;
    }

    /* Resizing Handles */
    .resize-handle { position: absolute; z-index: 100; }
    .handle-n { top: 0; left: 8px; right: 8px; height: 6px; cursor: n-resize; }
    .handle-s { bottom: 0; left: 8px; right: 8px; height: 6px; cursor: s-resize; }
    .handle-e { top: 8px; bottom: 8px; right: 0; width: 6px; cursor: e-resize; }
    .handle-w { top: 8px; bottom: 8px; left: 0; width: 6px; cursor: w-resize; }
    .handle-ne { top: 0; right: 0; width: 10px; height: 10px; cursor: ne-resize; }
    .handle-nw { top: 0; left: 0; width: 10px; height: 10px; cursor: nw-resize; }
    .handle-se { bottom: 0; right: 0; width: 10px; height: 10px; cursor: se-resize; }
    .handle-sw { bottom: 0; left: 0; width: 10px; height: 10px; cursor: sw-resize; }

    /* Title Bar */
    .title-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: #080912;
      border-bottom: 1px solid var(--card-border);
      flex-shrink: 0;
      cursor: grab;
    }

    .title-bar:active { cursor: grabbing; }

    .app-branding {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #cbd5e1;
      pointer-events: none;
    }

    .logo-icon {
      width: 22px;
      height: 22px;
      background: var(--accent-gradient);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .window-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .control-btn {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .control-btn:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
    .control-btn.close-btn:hover { background: #ef4444; color: #fff; }

    /* Body */
    .app-body {
      display: flex;
      flex: 1;
      height: calc(100% - 46px);
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 210px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--card-border);
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .nav-group { display: flex; flex-direction: column; gap: 4px; }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      color: var(--text-muted);
      font-size: 0.86rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
    }

    .nav-item:hover { background: rgba(255, 255, 255, 0.04); color: #fff; }
    .nav-item.active {
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.25);
    }

    .bunna-meter-box {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .meter-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      font-weight: 600;
      color: #fbbf24;
    }

    .meter-stats {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .meter-stats strong { color: #38bdf8; }

    .sparkline-svg {
      width: 100%;
      height: 20px;
      stroke: #38bdf8;
      fill: rgba(56, 189, 248, 0.1);
      stroke-width: 2;
    }

    /* Content Area */
    .content-area {
      flex: 1;
      padding: 12px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden; /* Prevents overflow pushing the player */
      width: 100%;
    }

    /* Toolbar */
    .downloader-input-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .input-field-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 120px;
    }

    .url-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 0.82rem;
      user-select: text;
    }

    .quality-select {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--card-border);
      color: #cbd5e1;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 0.74rem;
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-download { background: var(--accent); color: #fff; border: none; }

    /* ========================================================
       TRUE 16:9 DYNAMIC FIT CONTAINER (YOUTUBE ALGORITHM)
       ======================================================== */
    .player-theater-stage {
      flex: 1;
      min-height: 0; /* Critical: allows flex child to shrink properly */
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Dynamically computed box in JavaScript */
    .player-card-adaptive {
      background: #000;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.6);
      /* Dimensions set by autoFitPlayer() */
    }

    .video-viewport-16-9 {
      position: relative;
      width: 100%;
      flex: 1;
      background: #000;
      overflow: hidden;
    }

    /* Never squishes, never crops: displays 100% full frame */
    .video-viewport-16-9 img,
    .video-viewport-16-9 video,
    .video-viewport-16-9 iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain; /* Full 100% frame without zoom or crop */
      display: block;
    }

    .video-info-bar {
      padding: 8px 12px;
      background: #0f1022;
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .video-title {
      font-size: 0.82rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .video-sub {
      font-size: 0.7rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* Live Studio Box */
    .live-studio-box {
      background: var(--live-bg);
      border: 1px solid var(--live-border);
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    .studio-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.68rem;
      font-weight: 700;
    }

    .live-indicator {
      color: #f87171;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .live-dot {
      width: 5px;
      height: 5px;
      background: var(--live-red);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--live-red);
    }

    .replay-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .btn-replay-pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      color: #cbd5e1;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .btn-replay-pill:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }

    .btn-record-main {
      width: 100%;
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.25), rgba(220, 38, 38, 0.35));
      border: 1px solid var(--live-border);
      color: #fca5a5;
      padding: 7px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Narrow window adjustments */
    .app-window.narrow .sidebar {
      width: 54px;
      padding: 12px 6px;
    }
    .app-window.narrow .sidebar .nav-item span,
    .app-window.narrow .bunna-meter-box {
      display: none;
    }
    .app-window.narrow .sidebar .nav-item {
      justify-content: center;
    }
  </style>
</head>
<body>

  <main class="app-window" id="appWindow">

    <!-- Resizing Grips -->
    <div class="resize-handle handle-n" data-resize="n"></div>
    <div class="resize-handle handle-s" data-resize="s"></div>
    <div class="resize-handle handle-e" data-resize="e"></div>
    <div class="resize-handle handle-w" data-resize="w"></div>
    <div class="resize-handle handle-ne" data-resize="ne"></div>
    <div class="resize-handle handle-nw" data-resize="nw"></div>
    <div class="resize-handle handle-se" data-resize="se"></div>
    <div class="resize-handle handle-sw" data-resize="sw"></div>

    <!-- Title Bar -->
    <header class="title-bar" id="titleBar">
      <div class="app-branding">
        <div class="logo-icon">
          <i data-lucide="zap" style="width: 13px; height: 13px;"></i>
        </div>
        <span>GrabCut — Exact 16:9 Adaptive Fit</span>
      </div>

      <div class="window-controls">
        <button class="control-btn" id="btnMinimize"><i data-lucide="minus" style="width: 14px; height: 14px;"></i></button>
        <button class="control-btn" id="btnMaximize"><i data-lucide="square" style="width: 12px; height: 12px;"></i></button>
        <button class="control-btn close-btn" id="btnClose"><i data-lucide="x" style="width: 14px; height: 14px;"></i></button>
      </div>
    </header>

    <div class="app-body">
      <!-- Sidebar -->
      <nav class="sidebar">
        <div class="nav-group">
          <a class="nav-item"><i data-lucide="share-2" style="width: 16px; height: 16px;"></i><span>Share</span></a>
          <a class="nav-item"><i data-lucide="clock" style="width: 16px; height: 16px;"></i><span>History</span></a>
          <a class="nav-item active"><i data-lucide="download-cloud" style="width: 16px; height: 16px;"></i><span>Downloader</span></a>
          <a class="nav-item"><i data-lucide="film" style="width: 16px; height: 16px;"></i><span>Slide Maker</span></a>
          <a class="nav-item"><i data-lucide="settings" style="width: 16px; height: 16px;"></i><span>Settings</span></a>
        </div>

        <div class="bunna-meter-box">
          <div class="meter-header">
            <span>⚡ BUNNA METER</span>
            <span style="color: #64748b; font-size: 0.65rem;">LIVE</span>
          </div>
          <div class="meter-stats">
            <span>Down: <strong>2.8 Mbps</strong></span>
            <span>Up: <strong>252 Kbps</strong></span>
          </div>
          <svg class="sparkline-svg" viewBox="0 0 100 20" preserveAspectRatio="none">
            <polyline points="0,15 15,8 30,14 45,3 60,12 75,5 90,10 100,4" />
          </svg>
        </div>
      </nav>

      <!-- Main Content -->
      <section class="content-area">
        <!-- URL Bar -->
        <div class="downloader-input-card">
          <div class="input-field-wrapper">
            <i data-lucide="link" style="width: 14px; height: 14px; color: #94a3b8;"></i>
            <input type="text" class="url-input" value="https://www.youtube.com/watch?v=LAp2LBVXDQo" />
          </div>
          <select class="quality-select">
            <option>1080p HD</option>
            <option>4K Ultra HD</option>
            <option>720p</option>
          </select>
          <button class="btn-action"><i data-lucide="clipboard" style="width: 12px; height: 12px;"></i>Paste</button>
          <button class="btn-action btn-download"><i data-lucide="download" style="width: 12px; height: 12px;"></i>Download</button>
        </div>

        <!-- THEATER STAGE: JS-FITTED EXACT 16:9 CONTAINER -->
        <div class="player-theater-stage" id="stageContainer">
          <div class="player-card-adaptive" id="playerCard">
            <div class="video-viewport-16-9">
              <img 
                src="https://images.unsplash.com/photo-1594909122845-11baa439b7bf?q=80&w=1200&auto=format&fit=crop" 
                alt="16:9 Stream Buffer" 
              />
            </div>
            <div class="video-info-bar">
              <div>
                <div class="video-title">24/7 Non-Stop! Insanely Funny Superfan DELETED SCENES S1-9 | The Office</div>
                <div class="video-sub">
                  <span>The Office</span>
                  <span>•</span>
                  <span style="color: #f87171; font-weight: 600;">LIVE FEED (16:9 LOCKED)</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Live Studio Controls -->
        <div class="live-studio-box">
          <div class="studio-header">
            <span class="live-indicator"><span class="live-dot"></span> LIVE STUDIO</span>
            <span style="color: #94a3b8;">INSTANT REPLAY BUFFER</span>
          </div>

          <div class="replay-grid">
            <button class="btn-replay-pill"><i data-lucide="rotate-ccw" style="width: 12px; height: 12px;"></i>Last 30s</button>
            <button class="btn-replay-pill"><i data-lucide="rotate-ccw" style="width: 12px; height: 12px;"></i>Last 1 min</button>
            <button class="btn-replay-pill"><i data-lucide="rotate-ccw" style="width: 12px; height: 12px;"></i>Last 5 min</button>
          </div>

          <button class="btn-record-main"><span class="live-dot"></span>START RECORDING</button>
        </div>
      </section>
    </div>
  </main>

  <script>
    lucide.createIcons();

    const win = document.getElementById('appWindow');
    const titleBar = document.getElementById('titleBar');
    const stageContainer = document.getElementById('stageContainer');
    const playerCard = document.getElementById('playerCard');
    const btnMax = document.getElementById('btnMaximize');
    const btnMin = document.getElementById('btnMinimize');
    const btnClose = document.getElementById('btnClose');

    // ========================================================
    // YOUTUBE DYNAMIC SIZING ENGINE (Locks exact 16:9 to viewport)
    // ========================================================
    function autoFitPlayer() {
      const availW = stageContainer.clientWidth;
      const availH = stageContainer.clientHeight;
      const infoBarH = 40; // Height of the video title bar

      // Video viewport must be 16:9
      // Total card height = videoHeight + infoBarH
      const videoAvailH = Math.max(80, availH - infoBarH);

      // Compare aspect ratios to fit within bounds
      let w = availW;
      let h = (w * (9 / 16)) + infoBarH;

      if (h > availH) {
        // Limited by height
        const videoH = videoAvailH;
        w = videoH * (16 / 9);
        h = videoH + infoBarH;
      }

      playerCard.style.width = `${Math.floor(w)}px`;
      playerCard.style.height = `${Math.floor(h)}px`;
    }

    // Auto-fit on window resize
    const resizeObserver = new ResizeObserver(() => {
      autoFitPlayer();
      if (win.offsetWidth < 740) {
        win.classList.add('narrow');
      } else {
        win.classList.remove('narrow');
      }
    });
    resizeObserver.observe(stageContainer);
    resizeObserver.observe(win);

    // Initial center & fit
    win.style.top = `${Math.max(20, (window.innerHeight - 700) / 2)}px`;
    win.style.left = `${Math.max(20, (window.innerWidth - 1040) / 2)}px`;
    autoFitPlayer();

    // ========================================================
    // DRAGGING & RESIZING LOGIC
    // ========================================================
    let isDragging = false;
    let isResizing = false;
    let currentHandle = null;
    let startX, startY, startWidth, startHeight, startLeft, startTop;

    titleBar.addEventListener('mousedown', (e) => {
      if (e.target.closest('.window-controls') || win.classList.contains('maximized')) return;
      isDragging = true;
      startX = e.clientX - win.offsetLeft;
      startY = e.clientY - win.offsetTop;
    });

    document.querySelectorAll('.resize-handle').forEach(handle => {
      handle.addEventListener('mousedown', (e) => {
        if (win.classList.contains('maximized')) return;
        isResizing = true;
        currentHandle = handle.dataset.resize;
        startX = e.clientX;
        startY = e.clientY;
        startWidth = win.offsetWidth;
        startHeight = win.offsetHeight;
        startLeft = win.offsetLeft;
        startTop = win.offsetTop;
        e.stopPropagation();
      });
    });

    window.addEventListener('mousemove', (e) => {
      if (isDragging) {
        win.style.left = `${e.clientX - startX}px`;
        win.style.top = `${e.clientY - startY}px`;
      } else if (isResizing) {
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;

        if (currentHandle.includes('e')) win.style.width = `${Math.max(520, startWidth + dx)}px`;
        if (currentHandle.includes('s')) win.style.height = `${Math.max(440, startHeight + dy)}px`;
        if (currentHandle.includes('w')) {
          const newWidth = Math.max(520, startWidth - dx);
          if (newWidth > 520) {
            win.style.width = `${newWidth}px`;
            win.style.left = `${startLeft + dx}px`;
          }
        }
        if (currentHandle.includes('n')) {
          const newHeight = Math.max(440, startHeight - dy);
          if (newHeight > 440) {
            win.style.height = `${newHeight}px`;
            win.style.top = `${startTop + dy}px`;
          }
        }
        autoFitPlayer();
      }
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
      isResizing = false;
    });

    btnMax.addEventListener('click', () => {
      win.classList.toggle('maximized');
      setTimeout(autoFitPlayer, 50);
    });

    btnMin.addEventListener('click', () => {
      win.style.height = '46px';
    });

    titleBar.addEventListener('dblclick', () => {
      if (win.style.height === '46px') {
        win.style.height = '700px';
      } else {
        win.classList.toggle('maximized');
      }
      setTimeout(autoFitPlayer, 50);
    });

    btnClose.addEventListener('click', () => {
      win.style.opacity = '0';
      win.style.transform = 'scale(0.95)';
      win.style.transition = 'all 0.2s ease';
    });
  </script>
</body>
</html>
