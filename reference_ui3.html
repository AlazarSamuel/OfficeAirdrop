<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GrabCut - Recording Complete Modal</title>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-dark: #1e2139;
      --sidebar-bg: #17192d;
      --card-bg: rgba(22, 23, 44, 0.88);
      --card-border: rgba(255, 255, 255, 0.09);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --success: #10b981;
      --danger: #ef4444;
      --danger-soft: rgba(239, 68, 68, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
    }

    /* Ambient Background Glow */
    .ambient-glow {
      position: absolute;
      width: clamp(340px, 50vw, 700px);
      height: clamp(340px, 50vw, 700px);
      background: radial-gradient(circle, rgba(99, 102, 241, 0.14) 0%, rgba(168, 85, 247, 0.04) 50%, transparent 70%);
      top: 50%;
      left: 55%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }

    /* Window Shell */
    .app-window {
      position: relative;
      z-index: 1;
      width: 100vw;
      height: 100vh;
      background: var(--bg-dark);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Title Bar */
    .title-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      height: 44px;
      background: var(--sidebar-bg);
      border-bottom: 1px solid var(--card-border);
      flex-shrink: 0;
      user-select: none;
    }

    .app-branding {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #cbd5e1;
    }

    .logo-icon {
      width: 22px;
      height: 22px;
      background: var(--accent-gradient);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .trial-badge {
      font-size: 0.65rem;
      font-weight: 700;
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(239, 68, 68, 0.15));
      border: 1px solid rgba(245, 158, 11, 0.35);
      padding: 2px 7px;
      border-radius: 6px;
      color: #fbbf24;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .window-controls {
      display: flex;
      gap: 14px;
      color: var(--text-muted);
    }

    .window-controls svg {
      width: 14px;
      height: 14px;
      cursor: pointer;
      transition: color 0.2s;
    }

    .window-controls svg:hover {
      color: #fff;
    }

    .app-body {
      display: flex;
      flex: 1;
      height: calc(100vh - 44px);
      overflow: hidden;
    }

    /* Gliding Sidebar */
    .sidebar {
      position: relative;
      width: clamp(64px, 18vw, 220px);
      background: var(--sidebar-bg);
      border-right: 1px solid var(--card-border);
      padding: 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
      transition: width 0.2s ease;
    }

    .nav-indicator {
      position: absolute;
      left: 8px;
      right: 8px;
      height: 40px;
      background: rgba(99, 102, 241, 0.16);
      border: 1px solid rgba(99, 102, 241, 0.35);
      box-shadow: 0 0 16px rgba(99, 102, 241, 0.25);
      border-radius: 10px;
      pointer-events: none;
      z-index: 1;
      transform: translateY(0);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .nav-item {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      height: 40px;
      border-radius: 10px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.86rem;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
      overflow: hidden;
      white-space: nowrap;
    }

    .nav-item i {
      flex-shrink: 0;
      transition: transform 0.2s;
    }

    .nav-item:hover {
      color: #e2e8f0;
    }

    .nav-item:hover i {
      transform: scale(1.1);
      color: #a5b4fc;
    }

    .nav-item.active {
      color: #ffffff;
      font-weight: 600;
    }

    .nav-item.active i {
      color: #818cf8;
    }

    /* Content Area */
    .content-area {
      flex: 1;
      padding: clamp(10px, 1.8vw, 20px);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-y: auto;
      overflow-x: hidden;
      min-width: 0;
    }

    .content-area::-webkit-scrollbar {
      width: 5px;
    }
    .content-area::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }

    /* ================= RECORDING FINISHED CONTAINER CARD ================= */
    .recording-complete-card {
      width: 100%;
      max-width: 820px;
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: clamp(14px, 2vw, 20px);
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05);
      animation: modalScale 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes modalScale {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Header Section */
    .card-header-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 5px;
    }

    .header-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-title-row h2 {
      font-size: clamp(1.2rem, 1.7vw, 1.45rem);
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    .file-name-meta {
      font-size: clamp(0.74rem, 0.88vw, 0.8rem);
      color: var(--text-muted);
    }

    .file-name-meta strong {
      color: #cbd5e1;
    }

    .ready-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--success);
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.28);
      padding: 3px 10px;
      border-radius: 999px;
      margin-top: 2px;
    }

    /* Video Player Viewport */
    .player-stage {
      width: 100%;
      border-radius: 14px;
      background: #05060b;
      border: 1px solid var(--card-border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .video-frame {
      position: relative;
      width: 100%;
      height: clamp(180px, 36vh, 380px);
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .video-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0.95;
    }

    .play-center-btn {
      position: absolute;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(18, 19, 38, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    .play-center-btn:hover {
      background: var(--accent);
      transform: scale(1.08);
      border-color: var(--accent);
    }

    /* Custom Player Control Strip */
    .player-control-strip {
      background: rgba(13, 14, 28, 0.96);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding: 8px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .player-scrubber {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      position: relative;
      cursor: pointer;
    }

    .player-scrubber-fill {
      width: 15%;
      height: 100%;
      background: var(--accent-gradient);
      border-radius: 999px;
      position: relative;
    }

    .player-scrubber-fill::after {
      content: '';
      position: absolute;
      right: -3px;
      top: 50%;
      transform: translateY(-50%);
      width: 8px;
      height: 8px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(99, 102, 241, 0.9);
    }

    .player-controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .player-ctrl-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ctrl-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s;
    }

    .ctrl-btn:hover {
      color: #ffffff;
    }

    .time-digits {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.74rem;
      font-weight: 600;
      color: #cbd5e1;
    }

    .player-ctrl-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ================= BUTTON ACTION STRIP ================= */
    .bottom-action-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .action-group-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      flex: 1;
    }

    .btn-action-outline {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      color: #cbd5e1;
      padding: 8px 14px;
      height: 38px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-action-outline:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateY(-1px);
    }

    .btn-action-danger {
      background: var(--danger-soft);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #f87171;
      padding: 8px 14px;
      height: 38px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-action-danger:hover {
      background: rgba(239, 68, 68, 0.22);
      border-color: rgba(239, 68, 68, 0.45);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .btn-action-primary {
      background: var(--accent);
      color: #ffffff;
      border: none;
      padding: 8px 18px;
      height: 38px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-action-primary:hover {
      background: var(--accent-hover);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45);
      transform: translateY(-1px);
    }

    /* Responsive Adaptation for Small Window Sizes */
    @media (max-width: 680px) {
      .sidebar {
        width: 56px;
        padding: 12px 6px;
        align-items: center;
      }
      .nav-indicator {
        left: 6px;
        right: 6px;
      }
      .nav-item span {
        display: none;
      }
      .nav-item {
        justify-content: center;
        padding: 8px;
      }
      .bottom-action-bar {
        flex-direction: column;
      }
      .action-group-left, .btn-action-primary {
        width: 100%;
      }
      .btn-action-outline, .btn-action-danger, .btn-action-primary {
        flex: 1;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <main class="app-window">
    <!-- Header -->
    <header class="title-bar">
      <div class="app-branding">
        <div class="logo-icon">
          <i data-lucide="zap" style="width: 14px; height: 14px;"></i>
        </div>
        <span>GrabCut</span>
        <span class="trial-badge">
          <i data-lucide="sparkles" style="width: 11px; height: 11px;"></i> PRO TRIAL
        </span>
      </div>
      <div class="window-controls">
        <i data-lucide="minus"></i>
        <i data-lucide="square"></i>
        <i data-lucide="x"></i>
      </div>
    </header>

    <div class="app-body">
      <!-- Sidebar -->
      <nav class="sidebar" id="sidebar">
        <div class="nav-indicator" id="navIndicator"></div>

        <a class="nav-item">
          <i data-lucide="share-2" style="width: 17px; height: 17px;"></i>
          <span>Share</span>
        </a>
        <a class="nav-item">
          <i data-lucide="arrow-left-right" style="width: 17px; height: 17px;"></i>
          <span>Transfers</span>
        </a>
        <a class="nav-item">
          <i data-lucide="download-cloud" style="width: 17px; height: 17px;"></i>
          <span>Downloader</span>
        </a>
        <a class="nav-item">
          <i data-lucide="film" style="width: 17px; height: 17px;"></i>
          <span>Slide Maker</span>
        </a>
        <a class="nav-item active">
          <i data-lucide="video" style="width: 17px; height: 17px;"></i>
          <span>Recorder</span>
        </a>
        <a class="nav-item">
          <i data-lucide="settings" style="width: 17px; height: 17px;"></i>
          <span>Settings</span>
        </a>
      </nav>

      <!-- Main Stage -->
      <section class="content-area">
        <!-- Floating Centered Recording Finished Card -->
        <div class="recording-complete-card">
          <!-- Card Header -->
          <div class="card-header-center">
            <div class="header-title-row">
              <i data-lucide="video" style="width: 20px; height: 20px; color: #818cf8;"></i>
              <h2>Recording Complete</h2>
            </div>
            <p class="file-name-meta">Saved as <strong>GrabCut_Entire_screen_2026-08-28T21-47-55.mp4</strong></p>
            <span class="ready-pill">
              <i data-lucide="check" style="width: 12px; height: 12px;"></i>
              Ready to Share
            </span>
          </div>

          <!-- Video Player Stage -->
          <div class="player-stage">
            <div class="video-frame">
              <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1200&auto=format&fit=crop" alt="Captured Video Preview" />
              <button class="play-center-btn" title="Play Video">
                <i data-lucide="play" style="width: 20px; height: 20px; margin-left: 2px;"></i>
              </button>
            </div>

            <!-- Player Controls -->
            <div class="player-control-strip">
              <div class="player-scrubber">
                <div class="player-scrubber-fill"></div>
              </div>
              <div class="player-controls-row">
                <div class="player-ctrl-left">
                  <button class="ctrl-btn" title="Play/Pause">
                    <i data-lucide="play" style="width: 15px; height: 15px;"></i>
                  </button>
                  <button class="ctrl-btn" title="Mute/Unmute">
                    <i data-lucide="volume-2" style="width: 15px; height: 15px;"></i>
                  </button>
                  <span class="time-digits">0:00 / 0:13</span>
                </div>
                <div class="player-ctrl-right">
                  <button class="ctrl-btn" title="Fullscreen">
                    <i data-lucide="maximize-2" style="width: 14px; height: 14px;"></i>
                  </button>
                  <button class="ctrl-btn" title="More">
                    <i data-lucide="more-vertical" style="width: 14px; height: 14px;"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- Action Button Toolbar -->
          <div class="bottom-action-bar">
            <div class="action-group-left">
              <button class="btn-action-outline">
                <i data-lucide="video" style="width: 14px; height: 14px;"></i>
                Record Another
              </button>
              <button class="btn-action-outline">
                <i data-lucide="folder-open" style="width: 14px; height: 14px;"></i>
                Open Folder
              </button>
              <button class="btn-action-danger" title="Delete Recording">
                <i data-lucide="trash-2" style="width: 14px; height: 14px;"></i>
                Delete
              </button>
            </div>

            <button class="btn-action-primary">
              <i data-lucide="share-2" style="width: 15px; height: 15px;"></i>
              Send to Phone
            </button>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
    lucide.createIcons();

    // Gliding Indicator Animation Logic
    const navItems = document.querySelectorAll('.nav-item');
    const indicator = document.getElementById('navIndicator');

    function positionIndicator(target) {
      if (!target) return;
      indicator.style.transform = `translateY(${target.offsetTop - 16}px)`;
    }

    const activeItem = document.querySelector('.nav-item.active');
    if (activeItem) positionIndicator(activeItem);

    navItems.forEach(item => {
      item.addEventListener('click', () => {
        navItems.forEach(el => el.classList.remove('active'));
        item.classList.add('active');
        positionIndicator(item);
      });
    });

    window.addEventListener('resize', () => {
      const currentActive = document.querySelector('.nav-item.active');
      if (currentActive) positionIndicator(currentActive);
    });
  </script>
</body>
</html>
